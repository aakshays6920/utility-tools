<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compound Interest</title>
<meta name="description" content="Calculate savings growth with monthly contributions and inflation.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #000; --text: #fff; --muted: #86868b; --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.12); --accent: #2997ff; --btn-bg: #fff; --btn-text: #000; }
[data-theme="light"] { --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --card: rgba(0,0,0,0.03); --border: rgba(0,0,0,0.1); --btn-bg: #000; --btn-text: #fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; backdrop-filter: blur(20px); background: color-mix(in srgb, var(--bg) 70%, transparent); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
.nav a { color: var(--text); text-decoration: none; font-weight: 500; }
.toggle { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 980px; padding: 0.35rem 0.8rem; cursor: pointer; font-size: 0.8rem; }
.container { max-width: 720px; margin: 0 auto; padding: 7rem 1.5rem 4rem; animation: fadeUp 0.6s ease both; }
h1 { font-size: 2.8rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 2rem; text-align: center; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.2rem; }
label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; color: var(--muted); }
input, select { width: 100%; padding: 0.9rem 1rem; background: transparent; border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 1rem; font-family: inherit; }
input:focus, select:focus { outline: none; border-color: var(--accent); }
button { width: 100%; padding: 1rem; background: var(--btn-bg); color: var(--btn-text); border: none; border-radius: 980px; font-size: 1rem; font-weight: 500; cursor: pointer; margin-top: 0.5rem; transition: transform 0.2s; }
button:hover { transform: scale(1.02); }
.results { margin-top: 2rem; animation: fadeUp 0.4s ease both; }
.result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
.result-box { background: var(--card); border-radius: 14px; padding: 1.2rem; text-align: center; border: 1px solid var(--border); }
.result-box strong { display: block; font-size: 1.35rem; margin-bottom: 0.3rem; color: var(--accent); }
.result-box span { color: var(--muted); font-size: 0.85rem; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav class="nav"><a href="index.html">← Tools</a><button class="toggle" id="themeToggle">Light</button></nav>
<div class="container">
  <h1>Compound Interest</h1>
  <div class="card">
    <form id="ciForm">
      <div class="form-row">
        <div><label>Initial Amount</label><input type="number" id="principal" value="10000" min="0" required></div>
        <div><label>Monthly Contribution</label><input type="number" id="monthly" value="500" min="0"></div>
      </div>
      <div class="form-row">
        <div><label>Annual Rate (%)</label><input type="number" id="rate" value="7" step="0.1" min="0" required></div>
        <div><label>Years</label><input type="number" id="years" value="10" min="1" required></div>
      </div>
      <div class="form-row">
        <div><label>Compounding</label><select id="freq"><option value="12">Monthly</option><option value="4">Quarterly</option><option value="1">Annually</option></select></div>
        <div><label>Inflation % (optional)</label><input type="number" id="inflation" value="0" step="0.1" min="0"></div>
      </div>
      <button type="submit">Calculate</button>
    </form>
    <div id="results" class="results" style="display:none;">
      <div class="result-grid">
        <div class="result-box"><strong id="future"></strong><span>Future Value</span></div>
        <div class="result-box"><strong id="contrib"></strong><span>Total Contributed</span></div>
        <div class="result-box"><strong id="interest"></strong><span>Interest Earned</span></div>
        <div class="result-box"><strong id="real"></strong><span>Inflation-Adjusted</span></div>
      </div>
    </div>
  </div>
</div>
<script>
const toggle = document.getElementById('themeToggle');
const root = document.documentElement;
function setTheme(theme) {
  root.setAttribute('data-theme', theme);
  toggle.textContent = theme === 'light' ? 'Dark' : 'Light';
  localStorage.setItem('theme', theme);
}
setTheme(localStorage.getItem('theme') || 'dark');
toggle.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'));
document.getElementById('ciForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const P = parseFloat(document.getElementById('principal').value)||0;
  const PMT = parseFloat(document.getElementById('monthly').value)||0;
  const annualRate = parseFloat(document.getElementById('rate').value)||0;
  const years = parseInt(document.getElementById('years').value);
  const freq = parseInt(document.getElementById('freq').value);
  const inflation = parseFloat(document.getElementById('inflation').value)||0;
  const r = annualRate / 100 / freq;
  const n = years * freq;
  const monthlyR = annualRate / 100 / 12;
  const months = years * 12;
  const fvP = P * Math.pow(1 + r, n);
  const fvA = PMT * (Math.pow(1 + monthlyR, months) - 1) / monthlyR;
  const future = fvP + fvA;
  const totalContrib = P + PMT * months;
  const interest = future - totalContrib;
  const real = inflation > 0 ? future / Math.pow(1 + inflation/100, years) : future;
  document.getElementById('future').textContent = future.toFixed(0);
  document.getElementById('contrib').textContent = totalContrib.toFixed(0);
  document.getElementById('interest').textContent = interest.toFixed(0);
  document.getElementById('real').textContent = real.toFixed(0);
  document.getElementById('results').style.display = 'block';
});
</script>
</body>
</html>
