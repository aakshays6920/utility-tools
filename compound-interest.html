<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compound Interest Calculator – Savings & Investment Growth</title>
<meta name="description" content="Free compound interest calculator. See how your money grows with monthly contributions, different compounding frequencies, and inflation adjustment.">
<meta name="keywords" content="compound interest calculator, savings calculator, investment calculator, SIP calculator, future value">
<meta property="og:title" content="Compound Interest Calculator">
<meta property="og:description" content="Calculate future value of savings with monthly contributions.">
<meta property="og:type" content="website">
<style>
:root { --primary: #059669; --bg: #f8fafc; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #1e293b; }
.header { background: linear-gradient(135deg, #059669, #047857); color: white; padding: 1.5rem; text-align: center; }
.header h1 { font-size: 1.8rem; }
.container { max-width: 760px; margin: -1rem auto 2rem; padding: 0 1rem; }
.card { background: white; border-radius: 16px; padding: 1.75rem; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-group { margin-bottom: 1rem; }
label { display: block; margin-bottom: 0.4rem; font-weight: 600; }
input, select { width: 100%; padding: 0.85rem; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 1rem; }
button { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 600; cursor: pointer; }
.results { margin-top: 1.5rem; padding: 1.25rem; background: #ecfdf5; border-radius: 12px; }
.result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
.result-box { background: white; padding: 1rem; border-radius: 10px; text-align: center; }
.result-box strong { display: block; font-size: 1.35rem; color: var(--primary); }
.footer { text-align: center; padding: 1.5rem; font-size: 0.85rem; color: #64748b; }
.footer a { color: var(--primary); text-decoration: none; }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="header"><h1>Compound Interest Calculator</h1></div>
<div class="container">
  <div class="card">
    <form id="ciForm">
      <div class="form-row">
        <div class="form-group"><label for="principal">Initial Amount</label><input type="number" id="principal" value="10000" min="0" required></div>
        <div class="form-group"><label for="monthly">Monthly Contribution</label><input type="number" id="monthly" value="500" min="0"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label for="rate">Annual Rate (%)</label><input type="number" id="rate" value="7" step="0.1" min="0" required></div>
        <div class="form-group"><label for="years">Years</label><input type="number" id="years" value="10" min="1" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label for="freq">Compounding</label>
          <select id="freq"><option value="12">Monthly</option><option value="4">Quarterly</option><option value="1">Annually</option></select>
        </div>
        <div class="form-group"><label for="inflation">Inflation % (optional)</label><input type="number" id="inflation" value="0" step="0.1" min="0"></div>
      </div>
      <button type="submit">Calculate Growth</button>
    </form>
    <div id="results" class="results" style="display:none;">
      <div class="result-grid">
        <div class="result-box"><strong id="future"></strong> Future Value</div>
        <div class="result-box"><strong id="contrib"></strong> Total Contributed</div>
        <div class="result-box"><strong id="interest"></strong> Interest Earned</div>
        <div class="result-box"><strong id="real"></strong> Inflation-Adjusted</div>
      </div>
    </div>
  </div>
</div>
<div class="footer"><a href="privacy.html">Privacy Policy</a> • Educational tool • No data stored</div>
<script>
document.getElementById('ciForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const P = parseFloat(document.getElementById('principal').value)||0;
  const PMT = parseFloat(document.getElementById('monthly').value)||0;
  const annualRate = parseFloat(document.getElementById('rate').value)||0;
  const years = parseInt(document.getElementById('years').value);
  const freq = parseInt(document.getElementById('freq').value);
  const inflation = parseFloat(document.getElementById('inflation').value)||0;
  const r = annualRate / 100 / freq;
  const n = years * freq;
  const monthlyR = annualRate / 100 / 12;
  const months = years * 12;
  const fvP = P * Math.pow(1 + r, n);
  const fvA = PMT * (Math.pow(1 + monthlyR, months) - 1) / monthlyR;
  const future = fvP + fvA;
  const totalContrib = P + PMT * months;
  const interest = future - totalContrib;
  const real = inflation > 0 ? future / Math.pow(1 + inflation/100, years) : future;
  document.getElementById('future').textContent = future.toFixed(0);
  document.getElementById('contrib').textContent = totalContrib.toFixed(0);
  document.getElementById('interest').textContent = interest.toFixed(0);
  document.getElementById('real').textContent = real.toFixed(0);
  document.getElementById('results').style.display = 'block';
});
</script>
</body>
</html>
