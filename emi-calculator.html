<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI Calculator</title>
<meta name="description" content="Calculate monthly loan EMI, total interest, and amortization schedule.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #000; --text: #fff; --muted: #86868b; --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.12); --accent: #fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; backdrop-filter: blur(20px); background: rgba(0,0,0,0.65); border-bottom: 1px solid var(--border); padding: 1rem 2rem; }
.nav a { color: var(--text); text-decoration: none; font-weight: 500; }
.container { max-width: 720px; margin: 0 auto; padding: 7rem 1.5rem 4rem; }
h1 { font-size: 2.8rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 2rem; text-align: center; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; backdrop-filter: blur(12px); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.2rem; }
label { display: block; margin-bottom: 0.45rem; font-weight: 500; font-size: 0.9rem; color: var(--muted); }
input { width: 100%; padding: 0.9rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 1rem; font-family: inherit; }
input:focus { outline: none; border-color: rgba(255,255,255,0.4); }
button { width: 100%; padding: 1rem; background: #fff; color: #000; border: none; border-radius: 980px; font-size: 1rem; font-weight: 500; cursor: pointer; margin-top: 0.5rem; }
button:hover { opacity: 0.9; }
.results { margin-top: 2rem; }
.result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.result-box { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 1.2rem; text-align: center; }
.result-box strong { display: block; font-size: 1.4rem; margin-bottom: 0.3rem; }
.result-box span { color: var(--muted); font-size: 0.85rem; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
th, td { padding: 0.7rem; text-align: right; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 500; text-align: center; }
th:first-child, td:first-child { text-align: left; }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav class="nav"><a href="index.html">← Tools</a></nav>
<div class="container">
  <h1>EMI Calculator</h1>
  <div class="card">
    <form id="emiForm">
      <div class="form-row">
        <div><label>Loan Amount</label><input type="number" id="principal" value="500000" min="1" required></div>
        <div><label>Annual Rate (%)</label><input type="number" id="rate" value="8.5" step="0.1" min="0" required></div>
      </div>
      <div class="form-row">
        <div><label>Tenure (Years)</label><input type="number" id="tenure" value="20" min="1" required></div>
        <div><label>Extra Monthly</label><input type="number" id="extra" value="0" min="0"></div>
      </div>
      <button type="submit">Calculate</button>
    </form>
    <div id="results" class="results" style="display:none;">
      <div class="result-grid">
        <div class="result-box"><strong id="emi"></strong><span>Monthly EMI</span></div>
        <div class="result-box"><strong id="totalInterest"></strong><span>Total Interest</span></div>
        <div class="result-box"><strong id="totalPayment"></strong><span>Total Payment</span></div>
        <div class="result-box"><strong id="payoff"></strong><span>Payoff Time</span></div>
      </div>
      <h3 style="margin-bottom:0.8rem; font-weight:500;">Yearly Summary</h3>
      <div style="overflow-x:auto;"><table id="schedule"><thead><tr><th>Year</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead><tbody></tbody></table></div>
    </div>
  </div>
</div>
<script>
document.getElementById('emiForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const P = parseFloat(document.getElementById('principal').value);
  const annualRate = parseFloat(document.getElementById('rate').value);
  const years = parseInt(document.getElementById('tenure').value);
  const extra = parseFloat(document.getElementById('extra').value) || 0;
  const r = annualRate / 12 / 100;
  const n = years * 12;
  const baseEmi = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
  const emi = baseEmi + extra;
  let balance = P, totalInterest = 0, months = 0;
  const maxMonths = n * 2;
  while (balance > 0.01 && months < maxMonths) {
    const interest = balance * r;
    let principalPaid = emi - interest;
    if (principalPaid > balance) principalPaid = balance;
    balance -= principalPaid;
    totalInterest += interest;
    months++;
  }
  const payoffYears = Math.floor(months / 12);
  const payoffMonths = months % 12;
  document.getElementById('emi').textContent = emi.toFixed(0);
  document.getElementById('totalInterest').textContent = totalInterest.toFixed(0);
  document.getElementById('totalPayment').textContent = (P + totalInterest).toFixed(0);
  document.getElementById('payoff').textContent = payoffYears + 'y ' + payoffMonths + 'm';
  const tbody = document.querySelector('#schedule tbody');
  tbody.innerHTML = '';
  balance = P;
  for (let y = 1; y <= Math.ceil(months / 12); y++) {
    let yearP = 0, yearI = 0;
    for (let m = 1; m <= 12 && balance > 0; m++) {
      const interest = balance * r;
      let pp = emi - interest;
      if (pp > balance) pp = balance;
      yearI += interest; yearP += pp; balance -= pp;
    }
    const row = document.createElement('tr');
    row.innerHTML = `<td>${y}</td><td>${yearP.toFixed(0)}</td><td>${yearI.toFixed(0)}</td><td>${Math.max(0,balance).toFixed(0)}</td>`;
    tbody.appendChild(row);
  }
  document.getElementById('results').style.display = 'block';
});
</script>
</body>
</html>
