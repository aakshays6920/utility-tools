<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI Calculator</title>
<meta name="description" content="Calculate monthly loan EMI, total interest, and full amortization schedule. Currency auto-detects by country.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #000; --text: #fff; --muted: #86868b; --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.12); --accent: #2997ff; --btn-bg: #fff; --btn-text: #000; }
[data-theme="light"] { --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --card: rgba(0,0,0,0.03); --border: rgba(0,0,0,0.1); --btn-bg: #000; --btn-text: #fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; transition: background 0.3s, color 0.3s; }
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; backdrop-filter: blur(20px); background: color-mix(in srgb, var(--bg) 70%, transparent); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
.nav a { color: var(--text); text-decoration: none; font-weight: 500; }
.toggle { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 980px; padding: 0.35rem 0.8rem; cursor: pointer; font-size: 0.8rem; }
.container { max-width: 780px; margin: 0 auto; padding: 7rem 1.5rem 4rem; animation: fadeUp 0.6s ease both; }
h1 { font-size: 2.8rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 2rem; text-align: center; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.2rem; }
label { display: block; margin-bottom: 0.45rem; font-weight: 500; font-size: 0.9rem; color: var(--muted); }
input, select { width: 100%; padding: 0.9rem 1rem; background: transparent; border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 1rem; font-family: inherit; }
input:focus, select:focus { outline: none; border-color: var(--accent); }
button { width: 100%; padding: 1rem; background: var(--btn-bg); color: var(--btn-text); border: none; border-radius: 980px; font-size: 1rem; font-weight: 500; cursor: pointer; margin-top: 0.5rem; transition: transform 0.2s; }
button:hover { transform: scale(1.02); }
.results { margin-top: 2rem; animation: fadeUp 0.4s ease both; }
.result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.result-box { background: var(--card); border-radius: 14px; padding: 1.2rem; text-align: center; border: 1px solid var(--border); }
.result-box strong { display: block; font-size: 1.4rem; margin-bottom: 0.3rem; color: var(--accent); }
.result-box span { color: var(--muted); font-size: 0.85rem; }
.view-toggle { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.view-toggle button { width: auto; padding: 0.5rem 1.2rem; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 980px; }
.view-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.85rem; }
th, td { padding: 0.6rem; text-align: right; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 500; text-align: center; }
th:first-child, td:first-child { text-align: left; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav class="nav"><a href="index.html">← Tools</a><button class="toggle" id="themeToggle">Light</button></nav>
<div class="container">
  <h1>EMI Calculator</h1>
  <div class="card">
    <form id="emiForm">
      <div class="form-row">
        <div><label>Loan Amount</label><input type="number" id="principal" value="50000" min="1" required></div>
        <div><label>Currency</label><select id="currency"><option value="USD">USD ($)</option><option value="INR">INR (₹)</option><option value="EUR">EUR (€)</option><option value="GBP">GBP (£)</option><option value="AUD">AUD (A$)</option><option value="CAD">CAD (C$)</option><option value="SGD">SGD (S$)</option><option value="AED">AED (د.إ)</option></select></div>
      </div>
      <div class="form-row">
        <div><label>Annual Rate (%)</label><input type="number" id="rate" value="6.5" step="any" inputmode="decimal" min="0" required></div>
        <div><label>Tenure</label><input type="number" id="tenure" value="20" min="1" required></div>
      </div>
      <div class="form-row">
        <div><label>Tenure Unit</label><select id="tenureUnit"><option value="years">Years</option><option value="months">Months</option></select></div>
        <div><label>Extra Monthly</label><input type="number" id="extra" value="0" min="0" step="any"></div>
      </div>
      <button type="submit">Calculate EMI</button>
    </form>
    <div id="results" class="results" style="display:none;">
      <div class="result-grid">
        <div class="result-box"><strong id="emi"></strong><span>Monthly EMI</span></div>
        <div class="result-box"><strong id="principalOut"></strong><span>Principal</span></div>
        <div class="result-box"><strong id="totalInterest"></strong><span>Total Interest</span></div>
        <div class="result-box"><strong id="totalPayment"></strong><span>Total Amount</span></div>
        <div class="result-box"><strong id="payoff"></strong><span>Payoff Time</span></div>
      </div>
      <div class="view-toggle">
        <button class="active" id="viewYearly">Yearly</button>
        <button id="viewMonthly">Monthly</button>
      </div>
      <div style="overflow-x:auto;"><table id="schedule"><thead id="scheduleHead"></thead><tbody></tbody></table></div>
    </div>
  </div>
</div>
<script>
const toggle = document.getElementById('themeToggle');
const root = document.documentElement;
function setTheme(theme) {
  root.setAttribute('data-theme', theme);
  toggle.textContent = theme === 'light' ? 'Dark' : 'Light';
  localStorage.setItem('theme', theme);
}
setTheme(localStorage.getItem('theme') || 'dark');
toggle.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'));

function detectCurrency() {
  const lang = navigator.language || 'en-US';
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  const countryMap = {
    'en-IN': 'INR', 'hi-IN': 'INR',
    'en-GB': 'GBP', 'en-AU': 'AUD', 'en-CA': 'CAD',
    'en-SG': 'SGD', 'ar-AE': 'AED', 'en-AE': 'AED',
    'de-DE': 'EUR', 'fr-FR': 'EUR', 'es-ES': 'EUR', 'it-IT': 'EUR',
    'Asia/Kolkata': 'INR', 'Asia/Calcutta': 'INR',
    'Europe/London': 'GBP', 'Australia/Sydney': 'AUD',
    'America/Toronto': 'CAD', 'Asia/Singapore': 'SGD',
    'Asia/Dubai': 'AED', 'Europe/Berlin': 'EUR', 'Europe/Paris': 'EUR'
  };
  if (countryMap[lang]) return countryMap[lang];
  if (countryMap[tz]) return countryMap[tz];
  if (lang.startsWith('en-IN') || tz.includes('Kolkata') || tz.includes('Calcutta')) return 'INR';
  if (lang.includes('GB') || tz.includes('London')) return 'GBP';
  if (lang.includes('AU') || tz.includes('Australia')) return 'AUD';
  if (lang.includes('CA') || tz.includes('Toronto')) return 'CAD';
  if (lang.includes('SG') || tz.includes('Singapore')) return 'SGD';
  if (lang.includes('AE') || tz.includes('Dubai')) return 'AED';
  if (lang.includes('DE') || lang.includes('FR') || lang.includes('ES') || lang.includes('IT') || tz.includes('Europe')) return 'EUR';
  return 'USD';
}

const detected = detectCurrency();
document.getElementById('currency').value = detected;

let scheduleData = [];
let viewMode = 'yearly';
let currentCurrency = detected;

function formatCurrency(num) {
  try {
    return new Intl.NumberFormat(undefined, { style: 'currency', currency: currentCurrency, maximumFractionDigits: 0 }).format(Math.round(num));
  } catch {
    return currentCurrency + ' ' + Math.round(num).toLocaleString();
  }
}

document.getElementById('currency').addEventListener('change', () => {
  currentCurrency = document.getElementById('currency').value;
});

document.getElementById('emiForm').addEventListener('submit', function(e) {
  e.preventDefault();
  currentCurrency = document.getElementById('currency').value;
  const P = parseFloat(document.getElementById('principal').value);
  const annualRate = parseFloat(document.getElementById('rate').value);
  const tenureVal = parseInt(document.getElementById('tenure').value);
  const unit = document.getElementById('tenureUnit').value;
  const extra = parseFloat(document.getElementById('extra').value) || 0;
  const months = unit === 'years' ? tenureVal * 12 : tenureVal;
  const r = annualRate / 12 / 100;
  const baseEmi = P * r * Math.pow(1 + r, months) / (Math.pow(1 + r, months) - 1);
  const emi = baseEmi + extra;

  let balance = P, totalInterest = 0, m = 0;
  scheduleData = [];
  const maxMonths = months * 2;
  while (balance > 0.01 && m < maxMonths) {
    const interest = balance * r;
    let principalPaid = emi - interest;
    if (principalPaid > balance) principalPaid = balance;
    balance -= principalPaid;
    totalInterest += interest;
    m++;
    scheduleData.push({ month: m, principal: principalPaid, interest, balance: Math.max(0, balance) });
  }

  const payoffYears = Math.floor(m / 12);
  const payoffMonths = m % 12;
  document.getElementById('emi').textContent = formatCurrency(emi);
  document.getElementById('principalOut').textContent = formatCurrency(P);
  document.getElementById('totalInterest').textContent = formatCurrency(totalInterest);
  document.getElementById('totalPayment').textContent = formatCurrency(P + totalInterest);
  document.getElementById('payoff').textContent = payoffYears + 'y ' + payoffMonths + 'm';

  renderSchedule();
  document.getElementById('results').style.display = 'block';
});

function renderSchedule() {
  const head = document.getElementById('scheduleHead');
  const tbody = document.querySelector('#schedule tbody');
  tbody.innerHTML = '';
  if (viewMode === 'yearly') {
    head.innerHTML = '<tr><th>Year</th><th>Principal</th><th>Interest</th><th>Balance</th></tr>';
    let year = 1, yp = 0, yi = 0;
    scheduleData.forEach((row, i) => {
      yp += row.principal;
      yi += row.interest;
      if ((i + 1) % 12 === 0 || i === scheduleData.length - 1) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${year}</td><td>${formatCurrency(yp)}</td><td>${formatCurrency(yi)}</td><td>${formatCurrency(row.balance)}</td>`;
        tbody.appendChild(tr);
        year++; yp = 0; yi = 0;
      }
    });
  } else {
    head.innerHTML = '<tr><th>Month</th><th>Principal</th><th>Interest</th><th>Balance</th></tr>';
    scheduleData.slice(0, 120).forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${row.month}</td><td>${formatCurrency(row.principal)}</td><td>${formatCurrency(row.interest)}</td><td>${formatCurrency(row.balance)}</td>`;
      tbody.appendChild(tr);
    });
    if (scheduleData.length > 120) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="4" style="text-align:center; color:var(--muted);">Showing first 120 months</td>';
      tbody.appendChild(tr);
    }
  }
}

document.getElementById('viewYearly').addEventListener('click', () => {
  viewMode = 'yearly';
  document.getElementById('viewYearly').classList.add('active');
  document.getElementById('viewMonthly').classList.remove('active');
  renderSchedule();
});
document.getElementById('viewMonthly').addEventListener('click', () => {
  viewMode = 'monthly';
  document.getElementById('viewMonthly').classList.add('active');
  document.getElementById('viewYearly').classList.remove('active');
  renderSchedule();
});
</script>
</body>
</html>
