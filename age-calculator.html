<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator</title>
<meta name="description" content="Calculate exact age, days lived, and life progress.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #000; --text: #fff; --muted: #86868b; --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.12); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); }
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; backdrop-filter: blur(20px); background: rgba(0,0,0,0.65); border-bottom: 1px solid var(--border); padding: 1rem 2rem; }
.nav a { color: var(--text); text-decoration: none; font-weight: 500; }
.container { max-width: 640px; margin: 0 auto; padding: 7rem 1.5rem 4rem; }
h1 { font-size: 2.8rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 2rem; text-align: center; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; }
label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; color: var(--muted); }
input { width: 100%; padding: 0.9rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 1rem; font-family: inherit; }
button { width: 100%; padding: 1rem; background: #fff; color: #000; border: none; border-radius: 980px; font-size: 1rem; font-weight: 500; cursor: pointer; margin-top: 1rem; }
.results { margin-top: 2rem; }
.result-item { margin: 0.8rem 0; font-size: 1.1rem; }
.progress { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 1.2rem 0; overflow: hidden; }
.progress-bar { height: 100%; background: #fff; width: 0%; transition: width 0.4s; }
</style>
</head>
<body>
<nav class="nav"><a href="index.html">← Tools</a></nav>
<div class="container">
  <h1>Age Calculator</h1>
  <div class="card">
    <form id="ageForm">
      <label>Date of Birth</label>
      <input type="date" id="dob" required>
      <button type="submit">Calculate</button>
    </form>
    <div id="results" class="results" style="display:none;">
      <div class="result-item">Exact Age: <strong id="exactAge"></strong></div>
      <div class="result-item">Days Lived: <strong id="daysLived"></strong></div>
      <div class="result-item">Weeks Lived: <strong id="weeksLived"></strong></div>
      <div class="result-item">Next Birthday: <strong id="nextBirthday"></strong></div>
      <div class="result-item">Life Progress (to 80): <strong id="progressText"></strong></div>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </div>
  </div>
</div>
<script>
document.getElementById('ageForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const dob = new Date(document.getElementById('dob').value);
  const today = new Date();
  if (dob > today) { alert('Birth date cannot be in the future'); return; }
  let y = today.getFullYear() - dob.getFullYear();
  let m = today.getMonth() - dob.getMonth();
  let d = today.getDate() - dob.getDate();
  if (d < 0) { m--; d += new Date(today.getFullYear(), today.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  const msPerDay = 86400000;
  const daysLived = Math.floor((today - dob) / msPerDay);
  const weeksLived = Math.floor(daysLived / 7);
  let nextBday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
  if (nextBday < today) nextBday.setFullYear(today.getFullYear() + 1);
  const daysToBday = Math.ceil((nextBday - today) / msPerDay);
  const progress = Math.min(100, (daysLived / (80 * 365.25)) * 100);
  document.getElementById('exactAge').textContent = `${y} years, ${m} months, ${d} days`;
  document.getElementById('daysLived').textContent = daysLived.toLocaleString();
  document.getElementById('weeksLived').textContent = weeksLived.toLocaleString();
  document.getElementById('nextBirthday').textContent = `${daysToBday} days`;
  document.getElementById('progressText').textContent = progress.toFixed(1) + '%';
  document.getElementById('progressBar').style.width = progress + '%';
  document.getElementById('results').style.display = 'block';
});
</script>
</body>
</html>
