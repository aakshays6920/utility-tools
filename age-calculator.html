<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator – Exact Age, Days Lived & Next Birthday</title>
<meta name="description" content="Free age calculator. Find your exact age in years, months, days, total days lived, and days until next birthday.">
<meta name="keywords" content="age calculator, how old am I, date of birth calculator, next birthday, days lived">
<meta property="og:title" content="Age Calculator">
<meta property="og:description" content="Calculate exact age, total days lived, and next birthday countdown.">
<meta property="og:type" content="website">
<style>
:root { --primary: #7c3aed; --bg: #f8fafc; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #1e293b; }
.header { background: linear-gradient(135deg, #7c3aed, #5b21b6); color: white; padding: 1.5rem; text-align: center; }
.header h1 { font-size: 1.8rem; }
.container { max-width: 680px; margin: -1rem auto 2rem; padding: 0 1rem; }
.card { background: white; border-radius: 16px; padding: 1.75rem; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
.form-group { margin-bottom: 1rem; }
label { display: block; margin-bottom: 0.4rem; font-weight: 600; }
input { width: 100%; padding: 0.85rem; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 1rem; }
button { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 600; cursor: pointer; }
.results { margin-top: 1.5rem; padding: 1.25rem; background: #f5f3ff; border-radius: 12px; }
.result-item { margin: 0.7rem 0; font-size: 1.1rem; }
.progress { height: 8px; background: #e2e8f0; border-radius: 4px; margin: 1rem 0; overflow: hidden; }
.progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s; }
.footer { text-align: center; padding: 1.5rem; font-size: 0.85rem; color: #64748b; }
.footer a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>
<div class="header"><h1>Age Calculator</h1></div>
<div class="container">
  <div class="card">
    <form id="ageForm">
      <div class="form-group"><label for="dob">Date of Birth</label><input type="date" id="dob" required></div>
      <button type="submit">Calculate Age</button>
    </form>
    <div id="results" class="results" style="display:none;">
      <div class="result-item">Exact Age: <strong id="exactAge"></strong></div>
      <div class="result-item">Total Days Lived: <strong id="daysLived"></strong></div>
      <div class="result-item">Weeks Lived: <strong id="weeksLived"></strong></div>
      <div class="result-item">Next Birthday in: <strong id="nextBirthday"></strong></div>
      <div class="result-item">Life Progress (to 80): <strong id="progressText"></strong></div>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </div>
  </div>
</div>
<div class="footer"><a href="privacy.html">Privacy Policy</a> • Free tool • No data stored</div>
<script>
document.getElementById('ageForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const dob = new Date(document.getElementById('dob').value);
  const today = new Date();
  if (dob > today) { alert('Birth date cannot be in the future'); return; }
  let y = today.getFullYear() - dob.getFullYear();
  let m = today.getMonth() - dob.getMonth();
  let d = today.getDate() - dob.getDate();
  if (d < 0) { m--; d += new Date(today.getFullYear(), today.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  const msPerDay = 86400000;
  const daysLived = Math.floor((today - dob) / msPerDay);
  const weeksLived = Math.floor(daysLived / 7);
  let nextBday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
  if (nextBday < today) nextBday.setFullYear(today.getFullYear() + 1);
  const daysToBday = Math.ceil((nextBday - today) / msPerDay);
  const progress = Math.min(100, (daysLived / (80 * 365.25)) * 100);
  document.getElementById('exactAge').textContent = `${y} years, ${m} months, ${d} days`;
  document.getElementById('daysLived').textContent = daysLived.toLocaleString();
  document.getElementById('weeksLived').textContent = weeksLived.toLocaleString();
  document.getElementById('nextBirthday').textContent = `${daysToBday} days`;
  document.getElementById('progressText').textContent = progress.toFixed(1) + '%';
  document.getElementById('progressBar').style.width = progress + '%';
  document.getElementById('results').style.display = 'block';
});
</script>
</body>
</html>
