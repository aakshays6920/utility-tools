<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Tools</title>
<meta name="description" content="Case converter, word counter, and text utilities.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #000; --text: #fff; --muted: #86868b; --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.12); --accent: #2997ff; --btn-bg: #fff; --btn-text: #000; }
[data-theme="light"] { --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --card: rgba(0,0,0,0.03); --border: rgba(0,0,0,0.1); --btn-bg: #000; --btn-text: #fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; backdrop-filter: blur(20px); background: color-mix(in srgb, var(--bg) 70%, transparent); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
.nav a { color: var(--text); text-decoration: none; font-weight: 500; }
.toggle { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 980px; padding: 0.35rem 0.8rem; cursor: pointer; font-size: 0.8rem; }
.container { max-width: 760px; margin: 0 auto; padding: 7rem 1.5rem 4rem; animation: fadeUp 0.6s ease both; }
h1 { font-size: 2.8rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 2rem; text-align: center; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; }
textarea { width: 100%; height: 160px; padding: 1rem; background: transparent; border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 1rem; font-family: inherit; resize: vertical; }
textarea:focus { outline: none; border-color: var(--accent); }
.buttons { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.2rem 0; }
button { padding: 0.6rem 1.1rem; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 980px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
button:hover { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); }
button.primary:hover { transform: scale(1.04); }
.stats { margin-top: 1.2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.8rem; }
.stat { background: var(--card); padding: 0.9rem; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
.stat strong { display: block; font-size: 1.25rem; color: var(--accent); }
.stat span { color: var(--muted); font-size: 0.8rem; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<nav class="nav"><a href="index.html">← Tools</a><button class="toggle" id="themeToggle">Light</button></nav>
<div class="container">
  <h1>Text Tools</h1>
  <div class="card">
    <textarea id="text" placeholder="Type or paste text..."></textarea>
    <div class="buttons">
      <button onclick="convert('upper')">UPPER</button>
      <button onclick="convert('lower')">lower</button>
      <button onclick="convert('title')">Title</button>
      <button onclick="convert('sentence')">Sentence</button>
      <button onclick="convert('camel')">camelCase</button>
      <button onclick="convert('snake')">snake_case</button>
      <button onclick="convert('kebab')">kebab-case</button>
      <button onclick="convert('reverse')">Reverse</button>
      <button onclick="convert('clean')">Clean</button>
      <button class="primary" onclick="copyText()">Copy</button>
    </div>
    <div class="stats">
      <div class="stat"><strong id="words">0</strong><span>Words</span></div>
      <div class="stat"><strong id="chars">0</strong><span>Characters</span></div>
      <div class="stat"><strong id="charsNoSpace">0</strong><span>No spaces</span></div>
      <div class="stat"><strong id="sentences">0</strong><span>Sentences</span></div>
      <div class="stat"><strong id="reading">0</strong><span>min read</span></div>
    </div>
  </div>
</div>
<script>
const toggle = document.getElementById('themeToggle');
const root = document.documentElement;
function setTheme(theme) {
  root.setAttribute('data-theme', theme);
  toggle.textContent = theme === 'light' ? 'Dark' : 'Light';
  localStorage.setItem('theme', theme);
}
setTheme(localStorage.getItem('theme') || 'dark');
toggle.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'));
function updateStats() {
  const text = document.getElementById('text').value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const chars = text.length;
  const charsNoSpace = text.replace(/\s/g,'').length;
  const sentences = text.split(/[.!?]+/).filter(s => s.trim()).length;
  const reading = Math.ceil(words / 200) || 0;
  document.getElementById('words').textContent = words;
  document.getElementById('chars').textContent = chars;
  document.getElementById('charsNoSpace').textContent = charsNoSpace;
  document.getElementById('sentences').textContent = sentences;
  document.getElementById('reading').textContent = reading;
}
function convert(type) {
  const ta = document.getElementById('text');
  let t = ta.value;
  if (type==='upper') t = t.toUpperCase();
  else if (type==='lower') t = t.toLowerCase();
  else if (type==='title') t = t.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
  else if (type==='sentence') t = t.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
  else if (type==='camel') t = t.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (m,c) => c.toUpperCase());
  else if (type==='snake') t = t.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
  else if (type==='kebab') t = t.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
  else if (type==='reverse') t = t.split('').reverse().join('');
  else if (type==='clean') t = t.replace(/\s+/g,' ').trim();
  ta.value = t;
  updateStats();
}
function copyText() {
  navigator.clipboard.writeText(document.getElementById('text').value);
}
document.getElementById('text').addEventListener('input', updateStats);
</script>
</body>
</html>
