<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter</title>
<meta name="description" content="Convert pressure, length, temperature, weight, area, and speed.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #000; --text: #fff; --muted: #86868b; --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.12); --accent: #2997ff; --btn-bg: #fff; --btn-text: #000; }
[data-theme="light"] { --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --card: rgba(0,0,0,0.03); --border: rgba(0,0,0,0.1); --btn-bg: #000; --btn-text: #fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; backdrop-filter: blur(20px); background: color-mix(in srgb, var(--bg) 70%, transparent); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
.nav a { color: var(--text); text-decoration: none; font-weight: 500; }
.toggle { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 980px; padding: 0.35rem 0.8rem; cursor: pointer; font-size: 0.8rem; }
.container { max-width: 640px; margin: 0 auto; padding: 7rem 1.5rem 4rem; animation: fadeUp 0.6s ease both; }
h1 { font-size: 2.8rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 2rem; text-align: center; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; }
.tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
.tab { padding: 0.55rem 1.1rem; background: transparent; border: 1px solid var(--border); border-radius: 980px; color: var(--muted); cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; color: var(--muted); }
input, select { width: 100%; padding: 0.9rem 1rem; background: transparent; border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 1rem; font-family: inherit; margin-bottom: 1rem; }
input:focus, select:focus { outline: none; border-color: var(--accent); }
.swap { text-align: center; margin: 0.5rem 0 1rem; }
.swap button { width: auto; padding: 0.5rem 1.4rem; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 980px; cursor: pointer; }
.result { margin-top: 1.5rem; padding: 1.5rem; background: var(--card); border-radius: 14px; font-size: 1.3rem; text-align: center; font-weight: 500; border: 1px solid var(--border); color: var(--accent); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<nav class="nav"><a href="index.html">← Tools</a><button class="toggle" id="themeToggle">Light</button></nav>
<div class="container">
  <h1>Unit Converter</h1>
  <div class="card">
    <div class="tabs">
      <button class="tab active" data-type="pressure">Pressure</button>
      <button class="tab" data-type="length">Length</button>
      <button class="tab" data-type="temperature">Temperature</button>
      <button class="tab" data-type="weight">Weight</button>
      <button class="tab" data-type="area">Area</button>
      <button class="tab" data-type="speed">Speed</button>
    </div>
    <label>Value</label><input type="number" id="value" value="1" step="any">
    <label>From</label><select id="from"></select>
    <div class="swap"><button type="button" id="swapBtn">Swap</button></div>
    <label>To</label><select id="to"></select>
    <div class="result" id="result">Enter a value</div>
  </div>
</div>
<script>
const toggle = document.getElementById('themeToggle');
const root = document.documentElement;
function setTheme(theme) {
  root.setAttribute('data-theme', theme);
  toggle.textContent = theme === 'light' ? 'Dark' : 'Light';
  localStorage.setItem('theme', theme);
}
setTheme(localStorage.getItem('theme') || 'dark');
toggle.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'));
const units = {
  pressure: { psi:1, bar:0.0689476, kPa:6.89476, MPa:0.00689476, atm:0.068046, mmHg:51.7149 },
  length: { m:1, cm:100, mm:1000, km:0.001, in:39.3701, ft:3.28084, mi:0.000621371, yd:1.09361 },
  temperature: { C:'C', F:'F', K:'K' },
  weight: { kg:1, g:1000, lb:2.20462, oz:35.274, ton:0.001 },
  area: { m2:1, cm2:10000, km2:0.000001, ft2:10.7639, acre:0.000247105, hectare:0.0001 },
  speed: { mps:1, kmh:3.6, mph:2.23694, knot:1.94384, fps:3.28084 }
};
let currentType = 'pressure';
function populate() {
  const from = document.getElementById('from'), to = document.getElementById('to');
  from.innerHTML = ''; to.innerHTML = '';
  Object.keys(units[currentType]).forEach(u => {
    from.innerHTML += `<option>${u}</option>`;
    to.innerHTML += `<option>${u}</option>`;
  });
  if (currentType==='pressure'){from.value='psi';to.value='bar';}
  else if(currentType==='length'){from.value='m';to.value='ft';}
  else if(currentType==='temperature'){from.value='C';to.value='F';}
  else if(currentType==='weight'){from.value='kg';to.value='lb';}
  else if(currentType==='area'){from.value='m2';to.value='ft2';}
  else {from.value='kmh';to.value='mph';}
}
function convert() {
  const val = parseFloat(document.getElementById('value').value)||0;
  const fromU = document.getElementById('from').value;
  const toU = document.getElementById('to').value;
  let result;
  if (currentType==='temperature') {
    let c = fromU==='C'?val:fromU==='F'?(val-32)*5/9:val-273.15;
    result = toU==='C'?c:toU==='F'?c*9/5+32:c+273.15;
  } else {
    result = (val / units[currentType][fromU]) * units[currentType][toU];
  }
  document.getElementById('result').textContent = `${val} ${fromU} = ${result.toFixed(4)} ${toU}`;
}
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  currentType = tab.dataset.type;
  populate(); convert();
}));
document.getElementById('swapBtn').addEventListener('click', () => {
  const f = document.getElementById('from').value;
  document.getElementById('from').value = document.getElementById('to').value;
  document.getElementById('to').value = f;
  convert();
});
['value','from','to'].forEach(id => document.getElementById(id).addEventListener('input', convert));
populate(); convert();
</script>
</body>
</html>
